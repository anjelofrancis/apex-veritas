server {
    listen 80;
    listen [::]:80;
    
    # We leave server_name as _ to accept traffic from the AWS-provided raw IP or EC2 DNS.
    # In production with a real domain, you would change this to: api.yourdomain.com
    server_name _;

    # Route everything to the PM2 Node.js process running on port 4000
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
